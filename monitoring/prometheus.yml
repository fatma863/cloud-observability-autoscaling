global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: "fastapi-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api-service:8000"]
        labels:
          environment: "production"
          service: "cloud-app"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

